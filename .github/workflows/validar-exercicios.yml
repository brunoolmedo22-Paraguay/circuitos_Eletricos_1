name: Validar importação de 64 exercícios
on:
  push:
    branches: [main]
    paths:
      - 'resolucoes/**'
      - 'conteudo/pacotes/**'
      - 'tests/test_importacao*.py'
      - '.github/workflows/validar-exercicios.yml'
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_importacao.py tests/test_importacao_adicional.py
